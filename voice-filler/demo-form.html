<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Citizen Portal - Application Form</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #333;
      padding: 30px 20px;
      margin: 0;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .header {
      border-bottom: 2px solid #0056b3;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      color: #0056b3;
    }
    p.subtitle {
      margin: 0;
      font-size: 13px;
      color: #666;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      color: #222;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0056b3;
    }
    .radio-group {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-top: 6px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
      cursor: pointer;
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .col {
      flex: 1;
    }
    button.submit-btn {
      background: #0056b3;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button.submit-btn:hover {
      background: #004085;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>National Citizen Portal</h1>
      <p class="subtitle">Online Application & Welfare Verification Form (Sarkari Sahayak Demo)</p>
    </div>

    <form id="citizenForm" onsubmit="event.preventDefault(); alert('Form submitted successfully!');">
      <div class="form-group">
        <label for="applicant_name">Applicant Full Name</label>
        <input type="text" id="applicant_name" name="name" placeholder="e.g. Rahul Sharma" required />
      </div>

      <div class="form-group">
        <label for="father_name">Father's / Guardian's Name</label>
        <input type="text" id="father_name" name="father_name" placeholder="e.g. Ramesh Sharma" />
      </div>

      <div class="row">
        <div class="col form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" />
        </div>
        <div class="col form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="gender" value="male" /> Male
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="female" /> Female
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="other" /> Other
            </label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col form-group">
          <label for="phone">Mobile / Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" />
        </div>
        <div class="col form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@domain.com" />
        </div>
      </div>

      <div class="form-group">
        <label for="address">Permanent Residential Address</label>
        <textarea id="address" name="address" rows="3" placeholder="Enter full street address"></textarea>
      </div>

      <div class="row">
        <div class="col form-group">
          <label for="state">State</label>
          <select id="state" name="state">
            <option value="">Select State</option>
            <option value="WB">West Bengal</option>
            <option value="DL">Delhi</option>
            <option value="MH">Maharashtra</option>
            <option value="KA">Karnataka</option>
            <option value="TN">Tamil Nadu</option>
          </select>
        </div>
        <div class="col form-group">
          <label for="pincode">PIN / Postal Code</label>
          <input type="text" id="pincode" name="pincode" placeholder="e.g. 700001" />
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit Application</button>
    </form>
  </div>
</body>
</html>
